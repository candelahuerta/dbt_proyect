unit_tests:

  - name: test_calculo_metricas_lineas_pedido
    description: "Comprueba las fórmulas de importe neto, impuestos, coste, margen, días logísticos y retraso."
    model: int_lineas_pedido_enriquecidas
    given:
      - input: ref('stg_tpch__lineitem')
        rows:
          - {id_pedido: 1, numero_linea: 1, id_pieza: 10, id_proveedor: 20, cantidad: 10, precio_bruto: 1000, descuento: 0.10, impuesto: 0.05, fecha_envio: '2024-01-03', fecha_compromiso: '2024-01-08', fecha_recepcion: '2024-01-10'}
          - {id_pedido: 1, numero_linea: 2, id_pieza: 11, id_proveedor: 20, cantidad: 5, precio_bruto: 500, descuento: 0, impuesto: 0, fecha_envio: '2024-01-02', fecha_compromiso: '2024-01-15', fecha_recepcion: '2024-01-05'}
      - input: ref('stg_tpch__orders')
        rows:
          - {id_pedido: 1, id_cliente: 100, fecha_pedido: '2024-01-01'}
      - input: ref('stg_tpch__partsupp')
        rows:
          - {id_pieza: 10, id_proveedor: 20, coste_suministro: 50}
          - {id_pieza: 11, id_proveedor: 20, coste_suministro: 60}
    expect:
      rows:
        - {id_pedido: 1, numero_linea: 1, importe_neto: 900, importe_con_impuestos: 945, coste_total: 500, margen: 400, dias_hasta_envio: 2, dias_de_transito: 7, entregado_con_retraso: true}
        - {id_pedido: 1, numero_linea: 2, importe_neto: 500, importe_con_impuestos: 500, coste_total: 300, margen: 200, dias_hasta_envio: 1, dias_de_transito: 3, entregado_con_retraso: false}

  - name: test_clasificacion_saldo_clientes
    description: "Comprueba la clasificación Deudor/Solvente (incluido el caso límite de saldo cero) y los joins con nación y región."
    model: int_clientes_enriquecidos
    given:
      - input: ref('stg_tpch__customer')
        rows:
          - {id_cliente: 1, saldo_cuenta_cliente: -10.50, id_nacion: 1}
          - {id_cliente: 2, saldo_cuenta_cliente: 0, id_nacion: 1}
          - {id_cliente: 3, saldo_cuenta_cliente: 500, id_nacion: 2}
      - input: ref('stg_tpch__nation')
        rows:
          - {id_nacion: 1, nombre_nacion: 'SPAIN', id_region: 1}
          - {id_nacion: 2, nombre_nacion: 'JAPAN', id_region: 2}
      - input: ref('stg_tpch__region')
        rows:
          - {id_region: 1, nombre_region: 'EUROPE'}
          - {id_region: 2, nombre_region: 'ASIA'}
    expect:
      rows:
        - {id_cliente: 1, situacion_saldo: 'Deudor',   nombre_nacion: 'SPAIN', nombre_region: 'EUROPE'}
        - {id_cliente: 2, situacion_saldo: 'Solvente', nombre_nacion: 'SPAIN', nombre_region: 'EUROPE'}
        - {id_cliente: 3, situacion_saldo: 'Solvente', nombre_nacion: 'JAPAN', nombre_region: 'ASIA'}

  - name: test_agregacion_pedidos
    description: "Comprueba el cambio de granularidad de líneas a pedidos: conteos, sumas, media del descuento y líneas con retraso."
    model: int_pedidos_agregados
    given:
      - input: ref('int_lineas_pedido_enriquecidas')
        rows:
          - {id_pedido: 1, id_cliente: 100, fecha_pedido: '2024-01-01', estado_pedido: 'F', prioridad_pedido: '1-URGENT', cantidad: 10, importe_neto: 900, importe_con_impuestos: 945, margen: 400, descuento: 0.10, entregado_con_retraso: true}
          - {id_pedido: 1, id_cliente: 100, fecha_pedido: '2024-01-01', estado_pedido: 'F', prioridad_pedido: '1-URGENT', cantidad: 5, importe_neto: 500, importe_con_impuestos: 500, margen: 200, descuento: 0, entregado_con_retraso: false}
          - {id_pedido: 1, id_cliente: 100, fecha_pedido: '2024-01-01', estado_pedido: 'F', prioridad_pedido: '1-URGENT', cantidad: 5, importe_neto: 100, importe_con_impuestos: 110, margen: -50, descuento: 0.05, entregado_con_retraso: true}
          - {id_pedido: 2, id_cliente: 200, fecha_pedido: '2024-02-01', estado_pedido: 'O', prioridad_pedido: '5-LOW', cantidad: 1, importe_neto: 50, importe_con_impuestos: 52, margen: 10, descuento: 0, entregado_con_retraso: false}
    expect:
      rows:
        - {id_pedido: 1, numero_lineas: 3, cantidad_total: 20, importe_neto_total: 1500, importe_con_impuestos_total: 1555, margen_total: 550, descuento_medio: 0.05, lineas_con_retraso: 2}
        - {id_pedido: 2, numero_lineas: 1, cantidad_total: 1, importe_neto_total: 50, importe_con_impuestos_total: 52, margen_total: 10, descuento_medio: 0, lineas_con_retraso: 0}