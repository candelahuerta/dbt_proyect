version: 2

sources:
  - name: tpch
    description: "Dataset TPC-H de ejemplo de Snowflake (escala 1). Simula una empresa mayorista de piezas: clientes, proveedores, catálogo, pedidos y líneas de pedido. Es de solo lectura y sus datos abarcan de 1992 a 1998."
    database: SNOWFLAKE_SAMPLE_DATA
    schema: TPCH_SF1
    config:
      meta:
        propietario: "Snowflake (datos de ejemplo)"
        sistema_origen: "SNOWFLAKE_SAMPLE_DATA.TPCH_SF1"
    tables:
      - name: region
        description: "Regiones geográficas (5 filas)."
        columns:
          - name: r_regionkey
            description: "Identificador de la región."
          - name: r_name
            description: "Nombre de la región."
          - name: r_comment
            description: "Comentario de texto libre."

      - name: nation
        description: "Países, cada uno asociado a una región (25 filas)."
        columns:
          - name: n_nationkey
            description: "Identificador del país."
          - name: n_name
            description: "Nombre del país."
          - name: n_regionkey
            description: "Región a la que pertenece el país."
          - name: n_comment
            description: "Comentario de texto libre."

      - name: customer
        description: "Clientes de la empresa (150.000 filas). Contiene datos personales."
        config:
          meta:
            contiene_pii: true
        columns:
          - name: c_custkey
            description: "Identificador del cliente."
          - name: c_name
            description: "Nombre del cliente. Dato personal."
            config:
              meta:
                pii: true
          - name: c_address
            description: "Dirección del cliente. Dato personal."
            config:
              meta:
                pii: true
          - name: c_nationkey
            description: "País del cliente."
          - name: c_phone
            description: "Teléfono del cliente. Dato personal."
            config:
              meta:
                pii: true
          - name: c_acctbal
            description: "Saldo de la cuenta del cliente."
          - name: c_mktsegment
            description: "Segmento de mercado del cliente."
          - name: c_comment
            description: "Comentario de texto libre."

      - name: supplier
        description: "Proveedores de piezas (10.000 filas). Contiene datos de contacto."
        config:
          meta:
            contiene_pii: true
        columns:
          - name: s_suppkey
            description: "Identificador del proveedor."
          - name: s_name
            description: "Nombre del proveedor."
            config:
              meta:
                pii: true
          - name: s_address
            description: "Dirección del proveedor."
            config:
              meta:
                pii: true
          - name: s_nationkey
            description: "País del proveedor."
          - name: s_phone
            description: "Teléfono del proveedor."
            config:
              meta:
                pii: true
          - name: s_acctbal
            description: "Saldo de la cuenta del proveedor."
          - name: s_comment
            description: "Comentario de texto libre."

      - name: part
        description: "Catálogo de piezas (200.000 filas)."
        columns:
          - name: p_partkey
            description: "Identificador de la pieza."
          - name: p_name
            description: "Nombre de la pieza."
          - name: p_mfgr
            description: "Fabricante."
          - name: p_brand
            description: "Marca."
          - name: p_type
            description: "Tipo de pieza."
          - name: p_size
            description: "Tamaño de la pieza."
          - name: p_container
            description: "Tipo de envase."
          - name: p_retailprice
            description: "Precio de venta al público."
          - name: p_comment
            description: "Comentario de texto libre."

      - name: partsupp
        description: "Relación entre piezas y proveedores, con stock y coste de suministro (800.000 filas)."
        columns:
          - name: ps_partkey
            description: "Pieza suministrada."
          - name: ps_suppkey
            description: "Proveedor que la suministra."
          - name: ps_availqty
            description: "Stock disponible."
          - name: ps_supplycost
            description: "Coste unitario de suministro."
          - name: ps_comment
            description: "Comentario de texto libre."

      - name: orders
        description: "Cabecera de los pedidos (1.500.000 filas)."
        columns:
          - name: o_orderkey
            description: "Identificador del pedido."
          - name: o_custkey
            description: "Cliente que hace el pedido."
          - name: o_orderstatus
            description: "Estado del pedido: F, O o P."
          - name: o_totalprice
            description: "Importe total del pedido."
          - name: o_orderdate
            description: "Fecha del pedido."
          - name: o_orderpriority
            description: "Prioridad del pedido."
          - name: o_clerk
            description: "Empleado que gestiona el pedido."
          - name: o_shippriority
            description: "Prioridad de envío."
          - name: o_comment
            description: "Comentario de texto libre."

      - name: lineitem
        description: "Líneas de cada pedido (6.001.215 filas): qué pieza, de qué proveedor, cantidad, precio, descuento y fechas logísticas."
        columns:
          - name: l_orderkey
            description: "Pedido al que pertenece la línea."
          - name: l_partkey
            description: "Pieza vendida."
          - name: l_suppkey
            description: "Proveedor que la suministra."
          - name: l_linenumber
            description: "Número de línea dentro del pedido."
          - name: l_quantity
            description: "Cantidad vendida."
          - name: l_extendedprice
            description: "Precio de la línea antes de descuento e impuestos."
          - name: l_discount
            description: "Descuento, en tanto por uno."
          - name: l_tax
            description: "Impuesto, en tanto por uno."
          - name: l_returnflag
            description: "Indicador de devolución: R, A o N."
          - name: l_linestatus
            description: "Estado de la línea: F u O."
          - name: l_shipdate
            description: "Fecha de envío."
          - name: l_commitdate
            description: "Fecha de entrega comprometida."
          - name: l_receiptdate
            description: "Fecha de recepción."
          - name: l_shipinstruct
            description: "Instrucciones de entrega."
          - name: l_shipmode
            description: "Medio de transporte."
          - name: l_comment
            description: "Comentario de texto libre."