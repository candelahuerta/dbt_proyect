version: 2

sources:
  - name: tpch
    description: "Dataset TPC-H de ejemplo de Snowflake (escala 1). Simula una empresa mayorista de piezas."
    database: SNOWFLAKE_SAMPLE_DATA
    schema: TPCH_SF1
    tables:
      - name: customer
        description: "Clientes de la empresa."
      - name: lineitem
        description: "Líneas de cada pedido: qué pieza, de qué proveedor, cantidad, precio y fechas."
      - name: region
        description: "Regiones geográficas (5 filas)."
      - name: nation
        description: "Países, cada uno asociado a una región (25 filas)."
      - name: supplier
        description: "Proveedores de piezas."
      - name: part
        description: "Catálogo de piezas (productos)."
      - name: partsupp
        description: "Relación entre piezas y proveedores, con stock y coste de suministro."
      - name: orders
        description: "Cabecera de los pedidos."