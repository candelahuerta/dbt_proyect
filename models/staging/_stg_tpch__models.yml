version: 2

models:
  - name: stg_tpch__region
    description: '{{ doc("stg_tpch__region") }}'
    config:
      meta:
        tabla_origen: "SNOWFLAKE_SAMPLE_DATA.TPCH_SF1.REGION"
        tipo_carga: "total"
    columns:
      - name: id_region
        description: "Identificador de la región en el sistema origen (R_REGIONKEY)."
        data_tests:
          - unique
          - not_null
      - name: nombre_region
        description: "Nombre de la región: AFRICA, AMERICA, ASIA, EUROPE o MIDDLE EAST."
      - name: comentario_region
        description: "Comentario de texto libre del sistema origen."

  - name: stg_tpch__nation
    description: '{{ doc("stg_tpch__nation") }}'
    config:
      meta:
        tabla_origen: "SNOWFLAKE_SAMPLE_DATA.TPCH_SF1.NATION"
        tipo_carga: "total"
    columns:
      - name: id_nacion
        description: "Identificador del país en el sistema origen (N_NATIONKEY)."
        data_tests:
          - unique
          - not_null
      - name: nombre_nacion
        description: "Nombre del país."
      - name: id_region
        description: "Región a la que pertenece el país. Clave foránea hacia stg_tpch__region."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tpch__region')
                field: id_region
      - name: comentario_nacion
        description: "Comentario de texto libre del sistema origen."

  - name: stg_tpch__customer
    description: '{{ doc("stg_tpch__customer") }}'
    config:
      tags: ['dominio_clientes']
      meta:
        tabla_origen: "SNOWFLAKE_SAMPLE_DATA.TPCH_SF1.CUSTOMER"
        tipo_carga: "total"
        contiene_pii: true
    columns:
      - name: id_cliente
        description: "Identificador del cliente en el sistema origen (C_CUSTKEY). Clave natural del cliente."
        data_tests:
          - unique
          - not_null
      - name: nombre_cliente
        description: "Nombre del cliente. Dato personal."
        config:
          meta:
            pii: true
      - name: direccion_cliente
        description: "Dirección postal del cliente. Dato personal."
        config:
          meta:
            pii: true
      - name: id_nacion
        description: "País del cliente. Clave foránea hacia stg_tpch__nation."
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_tpch__nation')
                field: id_nacion
      - name: telefono_cliente
        description: "Teléfono de contacto del cliente. Dato personal."
        config:
          meta:
            pii: true
      - name: saldo_cuenta_cliente
        description: "Saldo de la cuenta del cliente. Puede ser negativo si el cliente debe dinero. Cambia con frecuencia, por eso no se vigila en el snapshot."
      - name: segmento_mercado
        description: "Segmento de mercado al que pertenece el cliente."
        data_tests:
          - accepted_values:
              arguments:
                values: ['AUTOMOBILE', 'BUILDING', 'FURNITURE', 'HOUSEHOLD', 'MACHINERY']
      - name: comentario_cliente
        description: "Comentario de texto libre del sistema origen."

  - name: stg_tpch__supplier
    description: '{{ doc("stg_tpch__supplier") }}'
    config:
      meta:
        tabla_origen: "SNOWFLAKE_SAMPLE_DATA.TPCH_SF1.SUPPLIER"
        tipo_carga: "total"
        contiene_pii: true
    columns:
      - name: id_proveedor
        description: "Identificador del proveedor en el sistema origen (S_SUPPKEY). Clave natural del proveedor."
        data_tests:
          - unique
          - not_null
      - name: nombre_proveedor
        description: "Nombre del proveedor."
        config:
          meta:
            pii: true
      - name: direccion_proveedor
        description: "Dirección postal del proveedor."
        config:
          meta:
            pii: true
      - name: id_nacion
        description: "País del proveedor. Clave foránea hacia stg_tpch__nation."
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_tpch__nation')
                field: id_nacion
      - name: telefono_proveedor
        description: "Teléfono de contacto del proveedor."
        config:
          meta:
            pii: true
      - name: saldo_cuenta_proveedor
        description: "Saldo de la cuenta del proveedor. Puede ser negativo."
      - name: comentario_proveedor
        description: "Comentario de texto libre del sistema origen."

  - name: stg_tpch__part
    description: '{{ doc("stg_tpch__part") }}'
    config:
      tags: ['dominio_productos']
      meta:
        tabla_origen: "SNOWFLAKE_SAMPLE_DATA.TPCH_SF1.PART"
        tipo_carga: "total"
    columns:
      - name: id_pieza
        description: "Identificador de la pieza en el sistema origen (P_PARTKEY). Clave natural del producto."
        data_tests:
          - unique
          - not_null
      - name: nombre_pieza
        description: "Nombre descriptivo de la pieza."
      - name: fabricante
        description: "Fabricante de la pieza (Manufacturer#1 a #5)."
      - name: marca
        description: "Marca de la pieza (Brand#11 a #55). Cada fabricante tiene 5 marcas."
      - name: tipo_pieza
        description: "Tipo de pieza, combinación de acabado, material y forma (por ejemplo, PROMO BURNISHED COPPER)."
      - name: tamano_pieza
        description: "Tamaño de la pieza, de 1 a 50."
      - name: tipo_envase
        description: "Tipo de envase en que se suministra la pieza (por ejemplo, SM BOX o LG CASE)."
      - name: precio_venta_publico
        description: "Precio de venta al público de la pieza."
      - name: comentario_pieza
        description: "Comentario de texto libre del sistema origen."

  - name: stg_tpch__partsupp
    description: '{{ doc("stg_tpch__partsupp") }}'
    config:
      tags: ['dominio_productos']
      meta:
        tabla_origen: "SNOWFLAKE_SAMPLE_DATA.TPCH_SF1.PARTSUPP"
        tipo_carga: "total"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['id_pieza', 'id_proveedor']
    columns:
      - name: id_pieza
        description: "Pieza suministrada. Clave foránea hacia stg_tpch__part."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tpch__part')
                field: id_pieza
      - name: id_proveedor
        description: "Proveedor que suministra la pieza. Clave foránea hacia stg_tpch__supplier."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tpch__supplier')
                field: id_proveedor
      - name: cantidad_disponible
        description: "Stock disponible del proveedor para esa pieza, en unidades."
        data_tests:
          - no_negativo
      - name: coste_suministro
        description: "Coste unitario que paga la empresa al proveedor por la pieza. Se usa para calcular el coste total y el margen."
        data_tests:
          - no_negativo
      - name: comentario_pieza_proveedor
        description: "Comentario de texto libre del sistema origen."

  - name: stg_tpch__orders
    description: '{{ doc("stg_tpch__orders") }}'
    config:
      tags: ['dominio_ventas']
      meta:
        tabla_origen: "SNOWFLAKE_SAMPLE_DATA.TPCH_SF1.ORDERS"
        tipo_carga: "incremental"
        columna_incremental: "fecha_pedido"
    columns:
      - name: id_pedido
        description: "Identificador del pedido en el sistema origen (O_ORDERKEY). Clave única del incremental."
        data_tests:
          - unique
          - not_null
      - name: id_cliente
        description: "Cliente que realiza el pedido. Clave foránea hacia stg_tpch__customer."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tpch__customer')
                field: id_cliente
      - name: estado_pedido
        description: "Estado del pedido: F (completado), O (abierto), P (parcial)."
        data_tests:
          - accepted_values:
              arguments:
                values: ['F', 'O', 'P']
      - name: precio_total_pedido
        description: "Importe total del pedido según el sistema origen."
      - name: fecha_pedido
        description: "Fecha del pedido. Se usa como referencia para la carga incremental."
        data_tests:
          - not_null:
              config:
                tags: ['dominio_fechas']
          - fecha_en_rango:
              arguments:
                fecha_minima: '1992-01-01'
                fecha_maxima: '1998-12-31'
      - name: prioridad_pedido
        description: "Prioridad asignada al pedido."
        data_tests:
          - accepted_values:
              arguments:
                values: ['1-URGENT', '2-HIGH', '3-MEDIUM', '4-NOT SPECIFIED', '5-LOW']
      - name: empleado
        description: "Código del empleado que gestionó el pedido (por ejemplo, Clerk#000000951)."
      - name: prioridad_envio
        description: "Prioridad de envío del pedido."
      - name: comentario_pedido
        description: "Comentario de texto libre del sistema origen."
      - name: fecha_carga
        description: '{{ doc("fecha_carga") }}'

  - name: stg_tpch__lineitem
    description: '{{ doc("stg_tpch__lineitem") }}'
    config:
      tags: ['dominio_ventas']
      meta:
        tabla_origen: "SNOWFLAKE_SAMPLE_DATA.TPCH_SF1.LINEITEM"
        tipo_carga: "incremental"
        columna_incremental: "fecha_envio"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['id_pedido', 'numero_linea']
      - dbt_expectations.expect_column_pair_values_A_to_be_greater_than_B:
          arguments:
            column_A: fecha_recepcion
            column_B: fecha_envio
            or_equal: true
    columns:
      - name: id_pedido
        description: "Pedido al que pertenece la línea. Forma la clave compuesta junto con numero_linea."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tpch__orders')
                field: id_pedido
      - name: numero_linea
        description: "Número de la línea dentro del pedido."
        data_tests:
          - not_null
      - name: id_pieza
        description: "Pieza vendida en la línea."
      - name: id_proveedor
        description: "Proveedor que suministra la pieza de esta línea."
      - name: cantidad
        description: "Unidades vendidas. Regla de negocio: entre 1 y 50."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 50
      - name: precio_bruto
        description: "Precio de la línea antes de descuento e impuestos."
        data_tests:
          - no_negativo
      - name: descuento
        description: "Descuento aplicado, en tanto por uno. Regla de negocio: entre 0 % y 10 %."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 0.10
      - name: impuesto
        description: "Impuesto aplicado, en tanto por uno. Regla de negocio: entre 0 % y 8 %."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 0.08
      - name: indicador_devolucion
        description: "R (devuelta), A (aceptada), N (sin incidencia)."
        data_tests:
          - accepted_values:
              arguments:
                values: ['A', 'N', 'R']
      - name: estado_linea
        description: "Estado de la línea: F (cerrada) u O (abierta)."
      - name: fecha_envio
        description: "Fecha de envío. Se usa como referencia para la carga incremental."
        data_tests:
          - not_null:
              config:
                tags: ['dominio_fechas']
          - fecha_en_rango:
              arguments:
                fecha_minima: '1992-01-01'
                fecha_maxima: '1998-12-31'
      - name: fecha_compromiso
        description: "Fecha de entrega comprometida con el cliente. Se compara con la de recepción para saber si hubo retraso."
      - name: fecha_recepcion
        description: "Fecha en que el cliente recibe el pedido."
        data_tests:
          - fecha_en_rango:
              arguments:
                fecha_minima: '1992-01-01'
                fecha_maxima: '1998-12-31'
      - name: instrucciones_envio
        description: "Instrucciones de entrega (por ejemplo, DELIVER IN PERSON)."
      - name: modo_envio
        description: "Medio de transporte utilizado."
        data_tests:
          - accepted_values:
              arguments:
                values: ['AIR', 'FOB', 'MAIL', 'RAIL', 'REG AIR', 'SHIP', 'TRUCK']
      - name: comentario_linea
        description: "Comentario de texto libre del sistema origen."
      - name: fecha_carga
        description: '{{ doc("fecha_carga") }}'