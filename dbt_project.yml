
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'tpch_dimensional'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'default'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
docs-paths: ["documentacion"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In dbt, the default materialization for a model is a view. This means, when you run 
# dbt run or dbt build, all of your models will be built as a view in your data platform. 
# The configuration below will override this setting for models in the example folder to 
# instead be materialized as tables. Any models you add to the root of the models folder will 
# continue to be built as views. These settings can be overridden in the individual model files
# using the `{{ config(...) }}` macro.

models:
  tpch_dimensional:
    +copy_grants: true
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: staging
      +materialized: table
      +tags: ['staging']
      +meta:
        capa: "staging"
        propietario: "Equipo de ingeniería de datos"
      +grants:
        select: ['ROL_ANALISTA']
    intermediate:
      +schema: intermediate
      +materialized: view
      +tags: ['intermediate']
      +meta:
        capa: "intermediate"
        propietario: "Equipo de ingeniería de datos"
      +grants:
        select: ['ROL_ANALISTA']
    marts:
      +schema: business
      +materialized: table
      +tags: ['business']
      +meta:
        capa: "business"
        propietario: "Equipo de analítica"
      +grants:
        select: ['ROL_ANALISTA', 'ROL_NEGOCIO']
    reporting:
      +schema: reporting
      +materialized: view
      +tags: ['reporting']
      +meta:
        capa: "reporting"
        propietario: "Unidades de negocio"
      +grants:
        select: ['ROL_ANALISTA', 'ROL_NEGOCIO']
  elementary:
    +schema: elementary
  dbt_project_evaluator:
    +schema: evaluador

data_tests:
  tpch_dimensional:
    staging:
      +tags: ['tests_staging']
    intermediate:
      +tags: ['tests_intermediate']
    marts:
      +tags: ['tests_business']
    business:
      +tags: ['tests_business']
    reporting:
      +tags: ['tests_reporting']
  dbt_project_evaluator:
    +severity: warn

#para que el elementary no haga nada en el CI
vars:
  disable_run_results: "{{ target.schema.lower().startswith('dbt_cloud_pr_') }}"
  disable_tests_results: "{{ target.schema.lower().startswith('dbt_cloud_pr_') }}"
  disable_dbt_artifacts_autoupload: "{{ target.schema.lower().startswith('dbt_cloud_pr_') }}"
  disable_dbt_invocation_autoupload: "{{ target.schema.lower().startswith('dbt_cloud_pr_') }}"